<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ff6b00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb35c"/>
      <stop offset="45%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0c0c0e"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- angular S monogram -->
  <g filter="url(#soft)">
    <path d="M348 150 H206 V246 H306 V362 H164"
          fill="none" stroke="url(#s)" stroke-width="82"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- top-edge highlight for depth -->
  <path d="M348 150 H206" fill="none" stroke="#ffd9b0" stroke-width="20"
        stroke-linecap="round" opacity="0.35"/>
</svg>

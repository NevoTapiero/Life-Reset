<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#ff6b00" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffa040"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9a4200"/>
      <stop offset="100%" stop-color="#e06000"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#0c0c0e"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- lower chevron: dimmer, the step behind you -->
  <path d="M256 296 108 420l40 44 108-90 108 90 40-44Z" fill="url(#arrow2)"/>

  <!-- upper chevron: bright, the level up -->
  <g filter="url(#soft)">
    <path d="M256 118 96 258l46 50 114-100 114 100 46-50Z" fill="url(#arrow)"/>
  </g>
  <path d="M256 150 138 254l18 20 100-88 100 88 18-20Z" fill="#ffd9b0" opacity="0.35"/>

  <!-- spark -->
  <path d="M256 52l10 22 22 10-22 10-10 22-10-22-22-10 22-10Z" fill="#ffb45c"/>
</svg>
